name: Build Demo APK
on:
  workflow_dispatch:
  push:
    branches: [main, feature/souq-derb]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --flavor demo -t lib/main_demo.dart
      - uses: actions/upload-artifact@v4
        with:
          name: souq-derb-demo-apk
          path: build/app/outputs/flutter-apk/app-demo-debug.apk
