name: Build Merchant APK
on:
  workflow_dispatch:
  push:
    branches: [main, feature/souq-derb]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build merchant APK
        run: >-
          flutter build apk --debug --flavor merchant -t lib/main_merchant.dart
          --dart-define=APP_ENV=production
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: souq-derb-merchant-apk
          path: build/app/outputs/flutter-apk/app-merchant-debug.apk
